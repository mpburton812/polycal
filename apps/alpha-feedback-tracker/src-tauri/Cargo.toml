[package]
name = "alpha-feedback-tracker"
version = "0.1.0"
description = "PolyCal alpha feedback triage desktop app"
authors = ["PolyCal"]
edition = "2021"

[lib]
name = "alpha_feedback_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
