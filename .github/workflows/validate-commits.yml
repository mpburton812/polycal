name: Validate Jira commits

on:
  pull_request:
    branches:
      - dev
      - test
      - production
      - main
  push:
    branches:
      - "feature/**"

jobs:
  validate-jira-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Jira keys (PC-xxx)
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: sh scripts/ci-validate-jira-commits.sh
