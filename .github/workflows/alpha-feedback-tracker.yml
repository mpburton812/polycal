name: Alpha feedback tracker

# Typecheck + Vite build for the Tauri companion app (PC-128).
# Full `tauri build` stays local/Windows — CI validates the web UI bundle only.

on:
  pull_request:
    branches:
      - dev
      - test
    paths:
      - "apps/alpha-feedback-tracker/**"
      - ".github/workflows/alpha-feedback-tracker.yml"
  push:
    branches:
      - "feature/**"
    paths:
      - "apps/alpha-feedback-tracker/**"
      - ".github/workflows/alpha-feedback-tracker.yml"

jobs:
  tracker-web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/alpha-feedback-tracker
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/alpha-feedback-tracker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and Vite build
        run: npm run build
