name: Production promotion gates

on:
  pull_request:
    branches:
      - production

jobs:
  audit-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: npm audit
        run: npm run audit:check

      - name: Vitest unit tests
        run: npm run test:unit

  e2e-build:
    needs: audit-unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build
        env:
          AUTH_SECRET: e2e-test-auth-secret-min-32-characters
          NEXT_PUBLIC_APP_ENV: feature

      - name: Upload Next build
        uses: actions/upload-artifact@v5
        with:
          name: next-build-production
          include-hidden-files: true
          path: |
            .next
            public
          retention-days: 1

  # Suite-scoped shards: serial×3 + safe×2 so workers:1 serial is not packed into shards 1–2 (PC-350).
  playwright:
    needs: e2e-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: playwright (${{ matrix.suite }} ${{ matrix.shard }}/${{ matrix.shards }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: serial
            shard: 1
            shards: 3
            workers: "1"
            include_mobile: "0"
            projects: "--project=chromium-serial"
          - suite: serial
            shard: 2
            shards: 3
            workers: "1"
            include_mobile: "0"
            projects: "--project=chromium-serial"
          - suite: serial
            shard: 3
            shards: 3
            workers: "1"
            include_mobile: "0"
            projects: "--project=chromium-serial"
          - suite: safe
            shard: 1
            shards: 2
            workers: "2"
            include_mobile: "1"
            projects: "--project=chromium-safe --project=mobile-chrome"
          - suite: safe
            shard: 2
            shards: 2
            workers: "2"
            include_mobile: "1"
            projects: "--project=chromium-safe --project=mobile-chrome"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Next build
        uses: actions/download-artifact@v5
        with:
          name: next-build-production

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run Playwright ${{ matrix.suite }} ${{ matrix.shard }}/${{ matrix.shards }}
        run: npm run test:e2e:ci -- ${{ matrix.projects }} --shard=${{ matrix.shard }}/${{ matrix.shards }}
        env:
          CI: "1"
          E2E_PARALLEL_WORKERS: ${{ matrix.workers }}
          E2E_INCLUDE_MOBILE: ${{ matrix.include_mobile }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-production-${{ matrix.suite }}-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
