name: Production promotion gates

on:
  pull_request:
    branches:
      - production

jobs:
  audit-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm run audit:check

      - name: Vitest unit tests
        run: npm run test:unit

  e2e-build:
    needs: audit-unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build
        env:
          AUTH_SECRET: e2e-test-auth-secret-min-32-characters
          NEXT_PUBLIC_APP_ENV: feature

      - name: Upload Next build
        uses: actions/upload-artifact@v4
        with:
          name: next-build-production
          include-hidden-files: true
          path: |
            .next
            public
          retention-days: 1

  playwright:
    needs: e2e-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Next build
        uses: actions/download-artifact@v4
        with:
          name: next-build-production

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run Playwright shard ${{ matrix.shard }}/5
        run: npm run test:e2e:ci -- --shard=${{ matrix.shard }}/5
        env:
          CI: "1"
          E2E_PARALLEL_WORKERS: "2"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-production-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
