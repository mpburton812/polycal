name: Android GitHub Release

# Signed PolyCal TWA APK on every push to production (PC-482).
# Secrets: POLYCAL_ANDROID_KEYSTORE_BASE64, POLYCAL_ANDROID_STORE_PASSWORD,
# POLYCAL_ANDROID_KEY_ALIAS, POLYCAL_ANDROID_KEY_PASSWORD

on:
  push:
    branches:
      - production

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build release metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          set +e
          node scripts/android-release-meta.mjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Tag already exists — skipping Android release"
            exit 0
          fi
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          VERSION_NAME=$(node -p "JSON.parse(require('fs').readFileSync('android-release.json','utf8')).versionName")
          VERSION_CODE=$(node -p "JSON.parse(require('fs').readFileSync('android-release.json','utf8')).versionCode")
          TAG=$(node -p "JSON.parse(require('fs').readFileSync('android-release.json','utf8')).tag")
          APK_NAME=$(node -p "JSON.parse(require('fs').readFileSync('android-release.json','utf8')).apkAssetName")
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        if: steps.meta.outputs.skip != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        if: steps.meta.outputs.skip != 'true'
        uses: android-actions/setup-android@v3

      - name: Decode keystore
        if: steps.meta.outputs.skip != 'true'
        env:
          POLYCAL_ANDROID_KEYSTORE_BASE64: ${{ secrets.POLYCAL_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${POLYCAL_ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "Missing secret POLYCAL_ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$POLYCAL_ANDROID_KEYSTORE_BASE64" | base64 -d > android-twa/android.keystore
          ls -la android-twa/android.keystore

      - name: Assemble release APK
        if: steps.meta.outputs.skip != 'true'
        working-directory: android-twa
        env:
          POLYCAL_ANDROID_STORE_FILE: ${{ github.workspace }}/android-twa/android.keystore
          POLYCAL_ANDROID_STORE_PASSWORD: ${{ secrets.POLYCAL_ANDROID_STORE_PASSWORD }}
          POLYCAL_ANDROID_KEY_ALIAS: ${{ secrets.POLYCAL_ANDROID_KEY_ALIAS }}
          POLYCAL_ANDROID_KEY_PASSWORD: ${{ secrets.POLYCAL_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease \
            -PpolycalVersionName="${{ steps.meta.outputs.version_name }}" \
            -PpolycalVersionCode="${{ steps.meta.outputs.version_code }}"

      - name: Stage APK and meta
        if: steps.meta.outputs.skip != 'true'
        run: |
          set -euo pipefail
          mkdir -p dist-android
          cp android-twa/app/build/outputs/apk/release/app-release.apk \
            "dist-android/${{ steps.meta.outputs.apk_name }}"
          cp android-twa/release-meta.json dist-android/release-meta.json
          ls -la dist-android

      - name: Create GitHub Release
        if: steps.meta.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE=$(node -p "JSON.parse(require('fs').readFileSync('android-release.json','utf8')).title")
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('android-release.json','utf8'));fs.writeFileSync('release-body.md', j.bodyMarkdown);"
          gh release create "${{ steps.meta.outputs.tag }}" \
            --title "$TITLE" \
            --notes-file release-body.md \
            "dist-android/${{ steps.meta.outputs.apk_name }}" \
            dist-android/release-meta.json
