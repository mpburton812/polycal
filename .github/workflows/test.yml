name: Test promotion checks

on:
  pull_request:
    branches:
      - test

jobs:
  audit-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: npm audit
        run: npm run audit:check

      - name: Vitest unit tests
        run: npm run test:unit

      - name: Production build
        run: npm run build
